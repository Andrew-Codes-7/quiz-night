<!doctype html>
<html lang="en">
<head>

<style>
:root{
  --bg:#f6f1e7; --surface:#fffdf8; --surface-2:#f1ebdf; --ink:#1d1b2f; --muted:#6b6880; --line:#e4dccb;
  --accent:#ff5a3c; --accent-ink:#fff; --good:#16935f; --bad:#d93a33; --gold:#e9a520;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(40,30,10,.25);
  --map:#2b2a44; --map-stroke:#fffdf8;
  --sil:brightness(0); --mono:none; --logo-bg:transparent;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12121f; --surface:#1c1c2e; --surface-2:#24243a; --ink:#f3f0ff; --muted:#9a97b3; --line:#2f2e48;
    --accent:#ff6b4a; --accent-ink:#fff; --good:#34d399; --bad:#f87171; --gold:#f6c454;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -12px rgba(0,0,0,.6);
    --map:#e9e4ff; --map-stroke:#1c1c2e;
    --sil:brightness(0) invert(.92); --mono:invert(.92); --logo-bg:#eceaf6;
  }
}
:root[data-theme="dark"]{
  --bg:#12121f; --surface:#1c1c2e; --surface-2:#24243a; --ink:#f3f0ff; --muted:#9a97b3; --line:#2f2e48;
  --accent:#ff6b4a; --accent-ink:#fff; --good:#34d399; --bad:#f87171; --gold:#f6c454;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -12px rgba(0,0,0,.6);
  --map:#e9e4ff; --map-stroke:#1c1c2e;
  --sil:brightness(0) invert(.92); --mono:invert(.92); --logo-bg:#eceaf6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 48px}
.sitefoot{max-width:880px;margin:0 auto;padding:16px 16px 28px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.sitefoot a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo b{color:var(--accent)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.iconbtn:hover{border-color:var(--muted)}
h1{font-size:clamp(34px,7vw,56px);line-height:1;letter-spacing:-.035em;margin:6px 0 10px;font-weight:800}
h2{font-size:26px;letter-spacing:-.02em;margin:0 0 4px;font-weight:800}
.sub{color:var(--muted);font-size:17px;margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left;box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:6px;min-height:150px}
.cat:hover{transform:translateY(-3px);border-color:var(--accent)}
.cat .em{font-size:34px;line-height:1}
.cat .nm{font-weight:800;font-size:20px;letter-spacing:-.01em;margin-top:6px}
.cat .ds{color:var(--muted);font-size:15px}
.cat .best{margin-top:auto;font-size:13px;color:var(--muted);padding-top:8px}
.cat .best b{color:var(--gold)}
.cat .best:empty{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.field{margin-bottom:22px}
.label{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface-2);border:2px solid transparent;border-radius:12px;padding:10px 16px;font-weight:600;font-size:16px;min-width:56px}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button small{display:block;font-weight:400;font-size:12px;opacity:.7}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pname{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 12px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.pname input{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;font-size:16px;outline:none}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:800;letter-spacing:-.01em;
  box-shadow:0 6px 0 -1px color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 -1px color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:1px 7px;font-size:13px;background:var(--surface);color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:14px}

/* game */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600}
.chip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.hud .grow{flex:1}
.hud .count{color:var(--muted);font-weight:600}
.timer{position:relative;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:8px}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:999px;width:100%}
.timer.warn i{background:var(--gold)}
.timer.urgent i{background:var(--bad)}
.secs{font-variant-numeric:tabular-nums;font-weight:800;font-size:28px;min-width:2ch;text-align:right}
.secs.urgent{color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px;text-align:center;margin-bottom:16px}
.qtag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.qtext{font-size:clamp(22px,4.2vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:4px auto 6px;max-width:680px}
.flag{height:clamp(150px,30vw,240px);max-width:100%;border-radius:10px;box-shadow:0 0 0 1px var(--line),0 12px 28px -14px rgba(0,0,0,.45);display:block;margin:6px auto 4px}
.minif{height:44px;border-radius:5px;box-shadow:0 0 0 1px var(--line);vertical-align:middle;margin-bottom:10px}
.shape{width:100%;height:clamp(200px,38vw,300px);display:block}
.shape path{fill:var(--map);stroke:var(--map-stroke);stroke-width:1;stroke-linejoin:round}
.answer{display:flex;gap:10px}
.answer input{flex:1;min-width:0;font-size:22px;font-weight:600;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);outline:none}
.answer input:focus{border-color:var(--ink)}
.answer.shake input{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.belowans{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tries{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.tries span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tries span.used{background:var(--bad)}
.wrongs{color:var(--bad);font-size:14px;text-decoration:line-through;opacity:.8}
.linkbtn{background:none;border:0;color:var(--muted);font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.reveal{border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:pop .25s ease-out}
.reveal.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.reveal.no{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.reveal .big{font-size:34px}
.reveal .msg{flex:1;min-width:200px}
.reveal .msg b{font-size:20px;display:block}
.reveal .pts{font-weight:800;font-size:26px;color:var(--good)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.loading{text-align:center;padding:60px 0;color:var(--muted)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* handoff */
.handoff{text-align:center;padding:30px 0}
.handoff .who{font-size:clamp(40px,9vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 6px}
.board{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:26px 0}
.board .p{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px;min-width:120px}
.board .p.cur{border-width:2px}
.board .p .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;justify-content:center}
.board .p .s{font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}

/* results */
.podium{display:flex;flex-direction:column;gap:10px;margin:20px 0 26px}
.prow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.prow.first{border:2px solid var(--gold)}
.prow .medal{font-size:30px;width:40px;text-align:center}
.prow .nm{font-weight:800;font-size:20px;flex:1;display:flex;align-items:center;gap:8px}
.prow .st{color:var(--muted);font-size:14px;text-align:right}
.prow .sc{font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;min-width:80px;text-align:right}
.review{margin-top:24px}
.review summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
.rv{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.rv img{height:24px;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.rv .q{flex:1}
.rv .a{font-weight:600}
.rv .g{color:var(--bad);font-size:13px}
.newbest{display:inline-block;background:var(--gold);color:#1d1b2f;font-weight:800;border-radius:999px;padding:4px 12px;font-size:14px;margin-left:8px;vertical-align:middle}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.err{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-radius:14px;padding:14px 16px;margin-bottom:16px}
.kidsmode{--accent:#7c5cff}
.kidsbanner{width:100%;display:flex;align-items:center;gap:16px;text-align:left;border:0;border-radius:22px;padding:18px 22px;margin-bottom:14px;color:#fff;
  background:linear-gradient(100deg,#7c5cff,#ff5a9d 55%,#ffa63c);box-shadow:var(--shadow);transition:transform .15s}
.kidsbanner:hover{transform:translateY(-3px)}
.kidsbanner .em{font-size:44px;line-height:1}
.kidsbanner .nm{display:block;font-weight:800;font-size:24px;letter-spacing:-.02em}
.kidsbanner .ds{display:block;font-size:15px;opacity:.95}
.kidsbanner .arrow{margin-left:auto;font-size:26px;font-weight:800}
.khint{display:inline-block;margin-top:8px;background:var(--surface-2);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted);font-size:15px}
.khint b{color:var(--ink)}
.qlogo{height:clamp(150px,30vw,230px);max-width:80%;object-fit:contain;display:block;margin:6px auto 10px}
.qlogo.sil{filter:var(--sil)}
.qlogo.mono{filter:var(--mono);height:clamp(130px,26vw,190px)}
.qlogo.shown{background:var(--logo-bg);border-radius:18px;padding:10px}
.rv img.mono{filter:var(--mono)}
.photo{display:block;margin:4px auto 6px;max-width:100%;max-height:clamp(200px,44vw,360px);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 12px 28px -14px rgba(0,0,0,.45)}
.credit{font-size:12px;color:var(--muted);min-height:16px;margin-bottom:6px}
.credit a{color:inherit}
.note{background:var(--surface-2);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--muted);margin:0 auto 12px;display:table}
.rv img.ph{height:30px;width:46px;object-fit:cover}
.path{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 4px;margin:8px 0 10px}
.stop{display:flex;flex-direction:column;align-items:center;gap:3px;max-width:118px;text-align:center}
.stop b{font-size:12px;line-height:1.2;font-weight:600}
.stop span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stop.txt{background:var(--surface-2);border-radius:12px;padding:9px 12px;max-width:150px}
.stop.txt b{font-size:15px;font-weight:800}
.path img{height:clamp(46px,10.5vw,82px);width:clamp(46px,10.5vw,82px);object-fit:contain;background:var(--logo-bg);border-radius:10px;padding:3px}
.path .arr{font-size:22px;color:var(--muted);font-weight:800}
.sat{display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,540px);margin:4px auto 6px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 12px 28px -14px rgba(0,0,0,.45);background:#0b1020}
.sat img{width:100%;aspect-ratio:1;display:block}
.emoji{font-size:clamp(46px,12vw,84px);line-height:1.25;margin:4px 0 8px;letter-spacing:.06em}
.members{font-size:clamp(22px,4.8vw,36px);font-weight:800;letter-spacing:-.01em;margin:14px auto 12px;max-width:640px;line-height:1.3;color:var(--accent)}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;animation:pop .25s ease-out}
.mc .mchead{grid-column:1/-1;font-size:14px;color:var(--muted);font-weight:600}
.mc button{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 12px;font-size:17px;font-weight:600}
.mc button:hover{border-color:var(--accent)}
.mc.always{margin-top:4px}
.mc.always button{padding:18px 12px;font-size:18px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(100%,460px);margin:4px auto 6px}
.quad img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px auto 14px;max-width:640px}
.chips span{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-weight:700;font-size:clamp(15px,2.6vw,19px)}
.clues{list-style:none;padding:0;margin:6px auto 8px;max-width:620px;text-align:left;display:flex;flex-direction:column;gap:6px}
.clues li{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:clamp(15px,2.4vw,18px);display:flex;gap:10px;animation:pop .25s ease-out}
.clues li b{color:var(--accent);min-width:14px}
.clues li.hid{display:none}
.cluebar{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:620px;margin:0 auto 8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.reveal .extra{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.t10title{font-size:clamp(20px,3.8vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:2px auto 8px;max-width:640px}
.board10{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:620px;margin:8px auto}
.board10 .slot{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:9px 12px;min-height:42px;text-align:left;font-weight:700}
.board10 .slot b{color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
.board10 .slot.got{background:color-mix(in srgb,var(--good) 18%,var(--surface));animation:pop .25s ease-out}
.board10 .slot.miss span{color:var(--muted);font-weight:500}
@media (max-width:560px){.board10{gap:5px}.board10 .slot{padding:7px 9px;min-height:36px;font-size:14px;gap:6px}.t10title{font-size:19px}}
.awardshead{margin:4px 0 10px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:26px}
.award{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;animation:pop .35s ease-out both}
.award:nth-child(2){animation-delay:.08s}.award:nth-child(3){animation-delay:.16s}.award:nth-child(4){animation-delay:.24s}.award:nth-child(5){animation-delay:.32s}.award:nth-child(6){animation-delay:.4s}
.award .ae{font-size:28px;line-height:1}
.award .at{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.award .aw{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px}
.award .ad{font-size:13px;color:var(--muted)}
.pixbox{display:flex;justify-content:center;margin:4px auto 6px}
.pixbox canvas{max-width:100%;max-height:clamp(220px,46vw,380px);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 12px 28px -14px rgba(0,0,0,.45);background:var(--surface-2)}
.pixsrc{display:none}
.rv img.tl{height:28px;box-shadow:none;background:var(--logo-bg);border-radius:4px}
@media (max-width:560px){
  .stage{padding:16px}
  .cat{min-height:0;padding:16px}
  .answer input{font-size:19px;padding:14px}
  .btn{padding:14px 18px}
  .prow .st{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<footer class="sitefoot">Quiz Night is a free game from <a href="https://emeraldcityapps.com" target="_blank" rel="noopener">Emerald City Apps</a> · <a href="https://emeraldcityapps.com" target="_blank" rel="noopener">More apps</a> · <a href="https://emeraldcityapps.com/privacy" target="_blank" rel="noopener">Privacy</a></footer>

<script>
/* =========================================================================
   DATA — countries
   iso2 | ISO numeric | name | capital | tier (1 famous, 2 known, 3 the rest) | name aliases | capital aliases
   ========================================================================= */
const COUNTRY_DATA = `
af|004|Afghanistan|Kabul|2||
al|008|Albania|Tirana|3||Tirane
dz|012|Algeria|Algiers|2||

// Every available question for a category, best candidates first. The game takes as many as it needs.

    case 'capitals': qs = C(c => c.cap && c.iso !== 'ps', capitalQ); break;

    case 'colleges': qs = byTier(COLLEGES.map(collegeQ), diff); break;
    case 'emoji': qs = byTier(EMOJI_SONGS.map(emojiQ), diff); break;

// --- Pixelation ---------------------------------------------------------------

function showClue(n) {

function startTimer() {

  game.cur.done = true;
  const left = timeLeft(); stopTimer();
  const q = game.questions[game.idx], p = curPlayer();
  const found = game.cur.found ? game.cur.found.size : 0;
  if (q.kind === 'top10') ok = found > 0;
  const pts = !ok ? 0 : q.kind === 'top10' ? top10Points(found) : game.cur.viaMC ? 50 : q.kind === 'clues' ? 100 + 20 * (6 - (game.cur.clue || 1)) : 100 + Math.round(100 * left / T.dur);
  if (ok) { p.score += pts; p.correct++; sfx.right(); } else if (why === 'time') sfx.timeup(); else sfx.wrong();
  game.log.push({ q, player: p, ok, pts, wrongs: game.cur.wrongs.slice(), secs: (T.dur - left) / 1000, rescue: !!game.cur.viaMC, clue: game.cur.clue || 1 });
  const extraFlag = q.kind === 'outline' ? `<img class="minif" style="margin:0" src="${FLAG_URL(q.iso)}" alt="">` : '';
  const head = q.kind === 'top10' ? (found === 10 ? 'All ten!' : `You found ${found} of 10.`) : ok ? 'Correct!' : why === 'time' ? "Time's up!" : why === 'pass' ? 'Passed.' : why === 'mc' ? 'Not that one.' : 'Out of tries.';
  const last = game.idx + 1 >= game.questions.length;
  document.getElementById('area').innerHTML = `
    <div class="reveal ${ok ? 'ok' : 'no'}">
      <span class="big">${ok ? '✅' : '❌'}</span>${extraFlag}
      <div class="msg"><b>${head}</b>${q.kind === 'top10' ? (found < 10 ? 'The ones you missed are shown in grey.' : '') : ok && norm(game.cur.guess) === norm(q.answerLabel) ? '' : `The answer is <b style="display:inline;font-size:inherit">${esc(q.answerLabel)}</b>`}${q.extra ? ` <span class="extra">${esc(q.extra)}</span>` : ''}</div>
      ${ok ? `<span class="pts">+${pts}</span>` : ''}
      <button class="btn" id="nextBtn" onclick="nextQ()">${last ? 'See results' : 'Next'} →</button>
    </div>
    <div class="hint" style="margin-top:10px;text-align:right">press <span class="kbd">Enter</span></div>`;
  const secs = document.getElementById('secs'); if (secs) secs.classList.remove('urgent');
  markSeen(q);
  const cr = document.getElementById('credit'); if (cr && q.creditHtml) cr.innerHTML = q.creditHtml; else if (cr && q.credit) cr.innerHTML = `Photo: ${esc(q.credit)} · <a href="${esc(q.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
  if (game.cur.pix) drawPix(null);
  document.querySelectorAll('#clues li').forEach(li => li.classList.remove('hid'));
  document.querySelectorAll('#board10 .slot:not(.got)').forEach(sl => { sl.classList.add('miss'); sl.querySelector('span').textContent = q.items[+sl.dataset.i][0]; });
  const lg = document.querySelector('.qlogo.sil'); if (lg) { lg.classList.remove('sil'); lg.classList.add('shown'); } // reveal the real logo
  lockUntil = performance.now() + 500;
}
function nextQ() {
  if (performance.now() < lockUntil) return;
  game.idx++;
  if (game.idx >= game.questions.length) { screen = 'results'; render(); return; }
  beginTurn();
}

/* ---------- Results ---------- */
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#ff5a3c', '#0fa89a', '#7c5cff', '#e9a520', '#3b82f6'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    box.appendChild(c);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4500);
}
// End-of-game awards, worked out from the game log. Only awards that actually happened are shown.
function gameAwards() {
  const L = game.log, P = game.players, solo = P.length === 1, out = [];
  const who = p => `<span class="dot" style="background:${p.color}"></span>${esc(p.name)}`;
  const label = q => q.kind === 'top10' ? q.title : q.answerLabel;
  // Fastest correct answer (not counting multiple-choice rescues or Top 10 lists)
  const fast = L.filter(l => l.ok && !l.rescue && l.q.kind !== 'top10').sort((a, b) => a.secs - b.secs)[0];
  if (fast) out.push({ e: '⚡', t: 'Fastest answer', p: fast.player, d: `${label(fast.q)} in ${fast.secs.toFixed(1)}s` });
  // Longest run of right answers in a row
  let best = null;
  for (const p of P) { let run = 0, top = 0; for (const l of L.filter(l => l.player === p)) { run = l.ok ? run + 1 : 0; top = Math.max(top, run); }
    if (top >= 3 && (!best || top > best.n)) best = { p, n: top }; }
  if (best) out.push({ e: '🔥', t: 'Hot streak', p: best.p, d: `${best.n} right in a row` });
  // Perfect game
  for (const p of P) { const mine = L.filter(l => l.player === p); if (mine.length >= 3 && mine.every(l => l.ok)) out.push({ e: '💯', t: 'Perfect game', p, d: `${mine.length} out of ${mine.length}` }); }
  if (!solo) {
    // Comeback: furthest climb from where they stood at half time
    const half = Math.floor(L.length / 2), mid = new Map(P.map(p => [p, 0]));
    L.slice(0, half).forEach(l => mid.set(l.player, mid.get(l.player) + l.pts));
    const rank = (scores, p) => [...scores.values()].filter(v => v > scores.get(p)).length;
    const fin = new Map(P.map(p => [p, p.score]));
    const climb = P.map(p => ({ p, up: rank(mid, p) - rank(fin, p) })).sort((a, b) => b.up - a.up)[0];
    if (half >= 2 && climb.up > 0) out.push({ e: '🧗', t: 'Comeback of the night', p: climb.p, d: `climbed ${climb.up} place${climb.up > 1 ? 's' : ''} in the second half` });
    // Most accurate (only worth a trophy if it isn't simply the winner)
    const acc = P.map(p => { const m = L.filter(l => l.player === p); return { p, a: m.length ? m.filter(l => l.ok).length / m.length : 0, m: m.length }; }).sort((a, b) => b.a - a.a);
    const top = P.slice().sort((a, b) => b.score - a.score)[0];
    if (acc[0].a > 0 && acc[0].p !== top && acc[0].a > acc[1].a) out.push({ e: '🎯', t: 'Sharpshooter', p: acc[0].p, d: `${Math.round(acc[0].a * 100)}% right, though not the fastest` });
    // Biggest single question
    const big = L.filter(l => l.ok).sort((a, b) => b.pts - a.pts)[0];
    if (big && big.pts >= 150 && big.player !== (fast && fast.player)) out.push({ e: '💥', t: 'Biggest hit', p: big.player, d: `${big.pts} points on one question` });
  }
  // Saved by the bell: most multiple-choice rescues
  const res = P.map(p => ({ p, n: L.filter(l => l.player === p && l.rescue && l.ok).length })).sort((a, b) => b.n - a.n)[0];
  if (res.n >= 2) out.push({ e: '🛟', t: 'Saved by the bell', p: res.p, d: `${res.n} last-second rescues` });
  // Six Clues: guessed on the very first clue
  const sharp = L.find(l => l.ok && l.q.kind === 'clues' && l.clue === 1);
  if (sharp) out.push({ e: '🕵️', t: 'Detective', p: sharp.player, d: `${sharp.q.answerLabel} on the first clue` });
  // Slowpoke: the closest call, a right answer with under a second to spare
  const close = L.filter(l => l.ok && !l.rescue && l.q.kind !== 'top10' && game.cfg.time - l.secs < 1.5).sort((a, b) => b.secs - a.secs)[0];
  if (close) out.push({ e: '😅', t: 'Down to the wire', p: close.player, d: `${label(close.q)} with ${(game.cfg.time - close.secs).toFixed(1)}s left` });
  return out.slice(0, 6).map(a => `<div class="award"><span class="ae">${a.e}</span><span class="at">${a.t}</span><span class="aw">${who(a.p)}</span><span class="ad">${esc(a.d)}</span></div>`).join('');
}
function renderResults() {
  const ranked = game.players.slice().sort((a, b) => b.score - a.score);
  const solo = game.players.length === 1, me = game.players[0];
  let newBest = false;
  if (solo) {
    const bests = store.get('best', {}), k = bestKey(game.cfg);
    if (me.score > (bests[k] || 0)) { newBest = me.score > 0; bests[k] = me.score; store.set('best', bests); }
  }
  const tie = !solo && ranked[1] && ranked[0].score === ranked[1].score;
  const medals = ['🥇', '🥈', '🥉', '4️⃣'];
  const avg = p => { const r = game.log.filter(l => l.player === p && l.ok); return r.length ? (r.reduce((s, l) => s + l.secs, 0) / r.length).toFixed(1) + 's avg' : '—'; };
  const missed = game.log.filter(l => !l.ok);
  const title = solo ? (me.correct === game.questions.length ? 'Perfect game!' : me.correct / game.questions.length >= .7 ? 'Great game!' : 'Game over') : tie ? "It's a tie!" : `${esc(ranked[0].name)} wins!`;
  app.innerHTML = topBar() + `
    <h1>${title}${newBest ? '<span class="newbest">New best!</span>' : ''}</h1>
    <p class="sub">${CAT[game.cfg.cat].emoji} ${CAT[game.cfg.cat].name} · ${game.cfg.rounds} questions each · ${game.cfg.time}s</p>
    <div class="podium">${ranked.map((p, i) => `
      <div class="prow ${i === 0 && !solo && !tie ? 'first' : ''}">
        <span class="medal">${solo ? '🎯' : medals[i]}</span>
        <span class="nm"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span>
        <span class="st">${p.correct}/${game.cfg.rounds} right<br>${avg(p)}</span>
        <span class="sc">${p.score}</span>
      </div>`).join('')}</div>
    ${(() => { const aw = gameAwards(); return aw ? `<h3 class="awardshead">Awards</h3><div class="awards">${aw}</div>` : ''; })()}
    <div class="row">
      <button class="btn" onclick="playAgain()">Play again</button>
      <button class="btn ghost" id="sharebtn" onclick="shareScore()">Share my score</button>
      <button class="btn ghost" onclick="game=null;screen='setup';render()">Change settings</button>
      <button class="btn ghost" onclick="game=null;screen='home';render()">New category</button>
    </div>
    ${missed.length ? `<details class="review" ${solo ? 'open' : ''}><summary>Answers you missed (${missed.length})</summary>
      ${missed.map(l => `<div class="rv">${l.q.img ? `<img class="${l.q.thumb}" src="${l.q.img}" alt="">` : l.q.iso ? `<img src="${FLAG_URL(l.q.iso)}" alt="">` : ''}
        <span class="q">${l.q.kind === 'flag' ? 'Flag' : l.q.kind === 'outline' ? 'Shape' : l.q.kind === 'logo' ? 'Logo' : l.q.kind === 'photo' ? 'Photo' : l.q.kind === 'sat' ? 'Satellite view' : l.q.kind === 'career' ? 'Career path' : l.q.kind === 'emoji' ? l.q.emoji : l.q.kind === 'top10' ? esc(l.q.title) : l.q.kind === 'quad' ? '4 photos' : l.q.kind === 'clues' ? 'Six clues' : l.q.kind === 'chips' ? esc(l.q.chips.join(' · ')) : l.q.kind === 'pix' ? 'Pixelated' : l.q.kind === 'members' ? esc(l.q.members) : esc(l.q.prompt)}${solo ? '' : ` <span class="hint">· ${esc(l.player.name)}</span>`}
        ${l.wrongs.length ? `<div class="g">${l.wrongs.map(esc).join(', ')}</div>` : ''}</span>
        <span class="a">${esc(l.q.answerLabel)}</span></div>`).join('')}</details>` : ''}`;
  if (solo ? me.correct >= game.questions.length * .7 : true) { confetti(); sfx.win(); }
  lockUntil = performance.now() + 900;
}
function playAgain() { if (performance.now() < lockUntil) return; game = null; startGame(); }

/* ---------- Share ---------- */
const SHARE_URL = 'https://quiz.emeraldcityapps.com';
function shareText() {
  const c = CAT[game.cfg.cat], ranked = game.players.slice().sort((a, b) => b.score - a.score);
  if (game.players.length === 1) {
    const me = game.players[0];
    return `I scored ${me.score} points on Quiz Night (${c.name}): ${me.correct}/${game.cfg.rounds} right. Can you beat me?`;
  }
  const tie = ranked[1] && ranked[0].score === ranked[1].score;
  return tie ? `It was a tie on Quiz Night (${c.name})! Think you can do better?`
             : `${ranked[0].name} won our Quiz Night game (${c.name}) with ${ranked[0].score} points. Think you can do better?`;
}
async function shareScore() {
  const btn = document.getElementById('sharebtn'), text = shareText();
  if (navigator.share) {
    try { await navigator.share({ title: 'Quiz Night', text, url: SHARE_URL }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text + ' ' + SHARE_URL); if (btn) btn.textContent = 'Copied to clipboard'; }
  catch { if (btn) btn.textContent = "Couldn't copy. Try again"; }
  if (btn) setTimeout(() => { btn.textContent = 'Share my score'; }, 2500);
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (screen === 'handoff') { e.preventDefault(); ready(); }
    else if (screen === 'question' && game && game.cur.done) { e.preventDefault(); nextQ(); }
    else if (screen === 'results' && document.activeElement === document.body) { e.preventDefault(); playAgain(); }
  } else if (e.key === 'Escape' && screen === 'question') { e.preventDefault(); giveUp(); }
  else if (screen === 'question' && game && game.cur.mcAlways && !game.cur.done && /^[1-4]$/.test(e.key)) { e.preventDefault(); pickChoice(+e.key - 1); }
});

render();
</script>
